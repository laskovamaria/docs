<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Документы — Мария Ласкова</title>
<style>
:root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fff; --muted:#666; --line:#e3e3e3; --accent:#8a6d3b; }
@media (prefers-color-scheme: dark) {
  :root { --fg:#e8e6e3; --bg:#16171a; --muted:#9a9a9a; --line:#2c2e33; --accent:#c9a227; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg);
  font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%; }
.wrap { max-width:44rem; margin:0 auto; padding:3rem 1.15rem 4rem; }
h1 { font-size:1.75rem; margin:0 0 .5rem; letter-spacing:-.01em; }
.lead { color:var(--muted); margin:0 0 2.2rem; }
.card { display:block; padding:1.15rem 1.25rem; border:1px solid var(--line); border-radius:.7rem;
  text-decoration:none; color:inherit; margin:.85rem 0; }
.card:hover { border-color:var(--accent); }
.card b { display:block; font-size:1.06rem; margin-bottom:.22rem; }
.card span { color:var(--muted); font-size:.93rem; }
footer { margin-top:3rem; padding-top:1.2rem; border-top:1px solid var(--line);
  color:var(--muted); font-size:.9rem; }
a { color:var(--accent); }
</style>
</head>
<body><div class="wrap">
<h1>Документы</h1>
<p class="lead">Мария Ласкова — телеграм-бот для разговора.</p>

<a class="card" href="politika.html">
  <b>Политика конфиденциальности</b>
  <span>Что запоминается, куда уходит, как убрать о себе всё</span>
</a>

<a class="card" href="usloviya.html">
  <b>Условия использования</b>
  <span>Что это такое, кому можно, чего не обещаем</span>
</a>

<footer>Маша — не человек, а программа. Писать ей можно с 18 лет.</footer>
</div></body>
</html>
